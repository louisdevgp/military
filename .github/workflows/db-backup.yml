name: Sauvegarde PostgreSQL (recette)
# Daily encrypted export of the server database (schema public), kept 30 days
# as a workflow artifact. Requires repository secrets SUPABASE_DB_URL
# (session pooler URI) and BACKUP_PASSPHRASE (20+ characters, kept elsewhere).
on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC = 02:30 Africa/Abidjan
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$DATABASE_URL" || { echo "Secret SUPABASE_DB_URL manquant"; exit 1; }
          test "${#BACKUP_PASSPHRASE}" -ge 20 || { echo "Secret BACKUP_PASSPHRASE trop court"; exit 1; }
      - name: Client PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
      - name: Export chiffré
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          infra/backup/pg_backup.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: mono-pg-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: error
